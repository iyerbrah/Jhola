# Jhola behind nginx. The Next.js app listens on 127.0.0.1:3000 only, so nginx is the one way in.
#
# This is the file as first installed, before HTTPS. The live copy is
# /etc/nginx/sites-available/jhola on the server, where certbot added the HTTPS (port 443) block
# and the http -> https redirect. deploy/deploy.sh never touches it. If you change this file,
# make the same change on the server, then: sudo nginx -t && sudo systemctl reload nginx

# Backstop limit for the cart API. The app's own limits (10 an hour per person, via Upstash) let
# requests through if Upstash can't be reached, so this keeps a cap on OpenAI spend even then.
# Normal use never gets near it.
limit_req_zone $binary_remote_addr zone=jhola_api:10m rate=20r/m;
# The same backstop for the cart editor agent, whose turns are cheaper and more frequent.
limit_req_zone $binary_remote_addr zone=jhola_agent:10m rate=30r/m;

upstream jhola_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name jhola.ramiyer.tech;

    # The API only takes a query of up to 300 characters.
    client_max_body_size 16k;

    # Set here once, inherited by both locations below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The app rate-limits by these. Both are overwritten with the real client address,
    # so a visitor can't fake them to get around the limits.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Building carts can take up to 50 s before the app gives up with a 502.
    proxy_read_timeout 70s;

    location = /api/build-carts {
        limit_req zone=jhola_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://jhola_app;
    }

    # The cart editor agent. Its requests carry three carts and recent chat (up to about 20 KB,
    # the app refuses over 64 KB), and its reply streams progress lines, so nginx mustn't hold it.
    location = /api/agent {
        client_max_body_size 64k;
        limit_req zone=jhola_agent burst=10 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_pass http://jhola_app;
    }

    location / {
        proxy_pass http://jhola_app;
    }
}
