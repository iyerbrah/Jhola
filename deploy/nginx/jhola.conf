# Jhola behind nginx. The Next.js app listens on 127.0.0.1:3000 only, so nginx is the one way in.
#
# This is the file as first installed, before HTTPS. The live copy is
# /etc/nginx/sites-available/jhola on the server, where certbot added the HTTPS (port 443) block
# and the http -> https redirect. deploy/deploy.sh never touches it. If you change this file,
# make the same change on the server, then: sudo nginx -t && sudo systemctl reload nginx

# Backstop limit for the shopping agent. The app's own limits (via Upstash) let requests through if
# Upstash can't be reached, so this keeps a cap on model spend even then. Normal use never gets near it.
limit_req_zone $binary_remote_addr zone=jhola_agent:10m rate=30r/m;
# Taps that re-solve the cart without a model call (chips, ticks, swaps) and share links: cheap, frequent.
limit_req_zone $binary_remote_addr zone=jhola_solve:10m rate=120r/m;

upstream jhola_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name jhola.ramiyer.tech;

    # Pages and feedback take small bodies; the agent's endpoints raise this below.
    client_max_body_size 16k;

    # Set here once, inherited by the locations below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The app rate-limits by these. Both are overwritten with the real client address,
    # so a visitor can't fake them to get around the limits.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # A turn gives up at 25 s; this leaves room so the app's own reply always arrives.
    proxy_read_timeout 70s;

    # The shopping agent. Its requests carry the session (brief, needs, pins) and recent chat; the app
    # refuses over 96 KB. Its reply streams the understanding line, the plan and the cart as they're ready.
    location = /api/chat {
        client_max_body_size 96k;
        limit_req zone=jhola_agent burst=10 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_pass http://jhola_app;
    }

    location ~ ^/api/(solve|share)$ {
        client_max_body_size 96k;
        limit_req zone=jhola_solve burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://jhola_app;
    }

    location / {
        proxy_pass http://jhola_app;
    }
}
