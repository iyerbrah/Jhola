# Runs on every pull request and on every push to main.
# Everything here is offline: no API keys, no model calls, no cost.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # same major version as the live server
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Catalog covers the promised dishes
        run: npm run catalog:check

      - name: UI colours pass WCAG AA
        run: npm run check:contrast

      - name: Production build
        run: npm run build
