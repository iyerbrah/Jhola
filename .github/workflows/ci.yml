# Runs on every pull request and on every push to main.
# Everything here is offline: no API keys, no model calls, no cost.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the request log's tests (tests/requestLog.test.ts). REQUIRE_DB_TESTS makes
    # them fail rather than skip if the database isn't there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # same major version as the live server
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Grocery catalogue covers shoppers' requests
        run: npm run catalog:coverage

      - name: UI colours pass WCAG AA
        run: npm run check:contrast

      - name: Production build
        run: npm run build
