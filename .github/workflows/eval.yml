# The eval checks, on PRs that can change answers, both against the real model:
# - the cart builder: 11 queries vs evals/baseline.json (about $0.15)
# - the cart editor agent: 6 scenarios vs evals/agent/baseline.json (about $0.03)
# Both reports go into one PR comment, and the run fails if either check fails.
#
# It only runs when matching files change, so it is not a required check
# (a required check that never starts would block the PR).
name: Eval

on:
  pull_request:
    paths:
      - "lib/**"
      - "data/**"
      - "evals/**"
      - "scripts/eval*.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Eval check (11 queries + 6 agent scenarios, real model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PRs from forks don't get repo secrets, so the check can't run there.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEXT_TELEMETRY_DISABLED: 1
      LLM_PROVIDER: openrouter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run the cart builder eval check
        id: eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          npm run eval:ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run the agent eval check
        id: agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          npm run eval:agent -- --ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # One report for one comment: the cart builder's (which starts with the comment marker), then the agent's.
      - name: Combine the reports
        if: always()
        run: |
          if [ ! -f evals/ci-report.md ]; then printf '<!-- jhola-eval -->\n## ❌ Eval check: no report (it crashed; see the run log)\n' > evals/ci-report.md; fi
          if [ -f evals/ci-agent-report.md ]; then printf '\n' >> evals/ci-report.md && cat evals/ci-agent-report.md >> evals/ci-report.md; fi

      - name: Add the report to the run summary
        if: always() && hashFiles('evals/ci-report.md') != ''
        run: cat evals/ci-report.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated in place on every push (found by its first-line marker).
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('evals/ci-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- jhola-eval -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@evals/ci-report.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file evals/ci-report.md
          fi

      - name: Fail if either eval check failed
        if: steps.eval.outputs.exit_code != '0' || steps.agent.outputs.exit_code != '0'
        run: |
          echo "An eval check failed (cart builder exit ${{ steps.eval.outputs.exit_code }}, agent exit ${{ steps.agent.outputs.exit_code }}). See the PR comment or the run summary."
          exit 1
