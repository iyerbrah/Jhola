# The shopping agent's eval check, against the real model, paid with the OPENROUTER_API_KEY secret:
# the ci chats of the final suite (evals/final/suite.json, about 37 chats, about $0.50), compared with
# evals/chat/baseline.json when it exists. The report goes into one PR comment, and the run fails if the check fails.
#
# Opt-in, because every run costs money: it runs only when a PR gets the "run-evals" label
# (remove and re-add the label to run it again after more pushes), or from the Actions tab.
# So it is not a required check (a required check that never starts would block the PR).
name: Eval

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Shopping agent eval check (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only for the run-evals label. PRs from forks don't get repo secrets, so the check can't run there.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-evals' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      NEXT_TELEMETRY_DISABLED: 1
      LLM_PROVIDER: openrouter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run the shopping agent eval check
        id: eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          npm run eval:chat -- --ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Make sure there's a report
        if: always()
        run: |
          if [ ! -f evals/ci-report.md ]; then printf '<!-- jhola-eval -->\n## ❌ Eval check: no report (it crashed; see the run log)\n' > evals/ci-report.md; fi

      - name: Add the report to the run summary
        if: always() && hashFiles('evals/ci-report.md') != ''
        run: cat evals/ci-report.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated in place on every run (found by its first-line marker).
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('evals/ci-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- jhola-eval -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@evals/ci-report.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file evals/ci-report.md
          fi

      - name: Fail if the eval check failed
        if: steps.eval.outputs.exit_code != '0'
        run: |
          echo "The eval check failed (exit ${{ steps.eval.outputs.exit_code }}). See the PR comment or the run summary."
          exit 1
